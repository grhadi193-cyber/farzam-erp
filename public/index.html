<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ERP فرزام</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Login -->
<div id="login-view" class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="login-brand">
      <div class="brand-logo">فرزام</div>
      <div>
        <h1>پنل یکپارچه مدیریت شرکت</h1>
        <p class="muted">سامانه مالی فرزام — ورود کاربران</p>
      </div>
    </div>
    <label>ایمیل
      <input type="email" id="login-email" required autocomplete="username">
    </label>
    <label>رمز عبور
      <input type="password" id="login-password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary block">ورود</button>
    <div id="login-error" class="error"></div>
  </form>
</div>

<!-- App -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-logo">فرزام</div>
      <div>
        <div class="brand-title">پنل یکپارچه مدیریت شرکت</div>
        <div class="brand-sub muted">آخرین به‌روزرسانی: <span id="last-update">—</span></div>
      </div>
    </div>
    <div class="top-controls">
      <div class="unit-toggle" id="unit-toggle">
        <button type="button" class="unit-btn active" data-unit="rial">ریال</button>
        <button type="button" class="unit-btn" data-unit="toman">تومان</button>
      </div>
      <button type="button" id="refresh-btn" class="btn primary">به‌روزرسانی</button>
      <div class="userbox">
        <span id="user-info"></span>
        <button type="button" id="logout-btn" class="btn small">خروج</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="tab active">داشبورد</button>
    <button data-tab="intake" class="tab">ورودی یکپارچه<span class="tab-badge" id="badge-intake"></span></button>
    <button data-tab="expenses" class="tab">هزینه‌ها<span class="tab-badge" id="badge-expenses"></span></button>
    <button data-tab="income" class="tab">درآمدها</button>
    <button data-tab="payroll" class="tab">حقوق و دستمزد</button>
    <button data-tab="ledgers" class="tab">دفاتر و چک‌ها</button>
    <button data-tab="customers" class="tab">مشتری‌ها<span class="tab-badge" id="badge-customers"></span></button>
    <button data-tab="products" class="tab">کالاها</button>
    <button data-tab="knowledge" class="tab">دانش و قوانین</button>
  </nav>

  <main>
    <section id="tab-dashboard" class="panel"></section>
    <section id="tab-intake" class="panel hidden"></section>
    <section id="tab-expenses" class="panel hidden"></section>
    <section id="tab-income" class="panel hidden"></section>
    <section id="tab-payroll" class="panel hidden"></section>
    <section id="tab-ledgers" class="panel hidden"></section>
    <section id="tab-customers" class="panel hidden"></section>
    <section id="tab-products" class="panel hidden"></section>
    <section id="tab-knowledge" class="panel hidden"></section>
  </main>

  <footer class="foot muted">مبالغ به ریال ذخیره می‌شوند؛ واحد نمایش از بالای صفحه قابل تغییر است — تاریخ‌ها: شمسی</footer>
</div>

<script src="/app.js"></script>
</body>
</html>
