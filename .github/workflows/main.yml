
name: Notify Destination Fork

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch destination sync
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/trehsan1-creator/farzam-erp/dispatches \
            -d '{"event_type":"upstream-pushed"}'
